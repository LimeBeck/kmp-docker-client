services:
  worker:
    image: alpine:3.21
    command: [sh, -c, 'while true; do echo worker-out; echo worker-err >&2; sleep 1; done']
    healthcheck:
      test: [CMD, 'true']
      interval: 1s
      timeout: 1s
      retries: 10
  stopped:
    image: alpine:3.21
    command: [sh, -c, 'echo stopped-out; echo stopped-err >&2']
  control:
    image: alpine:3.21
    command: [sh, -c, 'test -s /data/token || cat /proc/sys/kernel/random/uuid > /data/token; cat /data/token; exec sleep 86400']
    volumes:
      - control-data:/data
volumes:
  control-data:
