name: PR CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/cache@v5
        with:
          path: |
            ./.gradle/
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Set up Docker API 1.51 baseline
        id: docker
        uses: docker/setup-docker-action@v5
        with:
          version: v28.5.2

      - name: Expose and verify the SDK Unix socket
        env:
          TEST_DOCKER_SOCKET: ${{ steps.docker.outputs.sock }}
        run: |
          sudo systemctl stop docker.service docker.socket
          socket_path="${TEST_DOCKER_SOCKET#unix://}"
          test -S "$socket_path"
          sudo ln -sfn "$socket_path" /var/run/docker.sock
          docker --host unix:///var/run/docker.sock version
          test "$(curl --fail --silent --show-error --unix-socket /var/run/docker.sock http://localhost/v1.51/_ping)" = "OK"


      - name: Build, test, and generate documentation
        run: ./gradlew build :lib:dokkaGenerateHtml --warning-mode=fail --console=plain --max-workers=2

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr-unit-test-results
          path: lib/build/test-results/**/*.xml
