name: PR CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Docker ${{ matrix.docker }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        docker: [v28.5.2, v29.0.0]
        java: ["17", "21"]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}

      - uses: actions/cache@v5
        with:
          path: |
            ./.gradle/
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Set up Docker compatibility target
        id: docker
        uses: docker/setup-docker-action@v5
        with:
          version: ${{ matrix.docker }}

      - name: Expose and verify the SDK Unix socket
        env:
          TEST_DOCKER_SOCKET: ${{ steps.docker.outputs.sock }}
        run: |
          sudo systemctl stop docker.service docker.socket
          socket_path="${TEST_DOCKER_SOCKET#unix://}"
          test -S "$socket_path"
          sudo ln -sfn "$socket_path" /var/run/docker.sock
          docker --host unix:///var/run/docker.sock version
          test "$(curl --fail --silent --show-error --unix-socket /var/run/docker.sock http://localhost/v1.51/_ping)" = "OK"


      - name: Build, test, and generate documentation
        run: scripts/with-compose-fixture.sh ./gradlew build :lib:checkKotlinAbi :lib:dokkaGenerateHtml --warning-mode=fail --console=plain --max-workers=2

      - name: Build dashboard release executable
        if: matrix.docker == 'v28.5.2' && matrix.java == '21'
        run: ./gradlew :sample:htmxDashboard:linkReleaseExecutableLinuxX64 --warning-mode=fail --console=plain --max-workers=2

      - name: Upload dashboard executable
        if: matrix.docker == 'v28.5.2' && matrix.java == '21'
        uses: actions/upload-artifact@v6
        with:
          name: htmx-dashboard-linux-x64
          path: sample/htmxDashboard/build/bin/linuxX64/releaseExecutable/htmxDashboard.kexe
          if-no-files-found: error

      - name: Verify isolated daemon restart and resubscription
        timeout-minutes: 8
        if: matrix.docker == 'v29.0.0' && matrix.java == '21'
        run: scripts/with-isolated-docker.sh ./gradlew :lib:daemonRestartTest --warning-mode=fail --console=plain --max-workers=2

      - name: Verify Swarm APIs
        if: matrix.java == '21'
        timeout-minutes: 15
        env:
          MATRIX_DOCKER: ${{ matrix.docker }}
        run: RC_DOCKER_IMAGE="docker:${MATRIX_DOCKER#v}-dind" bash scripts/with-swarm-fixture.sh ./gradlew :lib:jvmTest --tests '*Swarm*' :lib:jsNodeTest --tests '*Swarm*' :lib:linuxX64Test --tests '*Swarm*' --warning-mode=fail --console=plain --max-workers=2

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr-unit-test-results-${{ matrix.docker }}-jdk${{ matrix.java }}
          path: |
            lib/build/test-results/**/*.xml
