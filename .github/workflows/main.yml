name: Release CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release version from tag
        run: echo "LIB_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/cache@v5
        with:
          path: |
            ./.gradle/
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Set up Docker API 1.51 baseline
        id: docker
        uses: docker/setup-docker-action@v5
        with:
          version: v28.5.2

      - name: Expose and verify the SDK Unix socket
        env:
          TEST_DOCKER_SOCKET: ${{ steps.docker.outputs.sock }}
        run: |
          sudo systemctl stop docker.service docker.socket
          socket_path="${TEST_DOCKER_SOCKET#unix://}"
          test -S "$socket_path"
          sudo ln -sfn "$socket_path" /var/run/docker.sock
          docker --host unix:///var/run/docker.sock version
          test "$(curl --fail --silent --show-error --unix-socket /var/run/docker.sock http://localhost/v1.51/_ping)" = "OK"

      - name: Build with Gradle
        run: ./gradlew build --warning-mode=fail --max-workers=2 -PlibVersion=$LIB_VERSION

      - name: Upload Build Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results-build
          path: |
            lib/build/test-results/**/*.xml

      - name: Build dashboard release executable
        run: ./gradlew :sample:htmxDashboard:linkReleaseExecutableLinuxX64 --warning-mode=fail --console=plain --max-workers=2 -PlibVersion=$LIB_VERSION

      - name: Upload dashboard executable
        uses: actions/upload-artifact@v6
        with:
          name: htmx-dashboard-linux-x64
          path: sample/htmxDashboard/build/bin/linuxX64/releaseExecutable/htmxDashboard.kexe
          if-no-files-found: error

      - name: Publish libs as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Package
          path: lib/build/libs

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release version from tag
        run: echo "LIB_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/cache@v5
        with:
          path: |
            ./.gradle/
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Set up Docker API 1.51 baseline
        id: docker
        uses: docker/setup-docker-action@v5
        with:
          version: v28.5.2

      - name: Expose and verify the SDK Unix socket
        env:
          TEST_DOCKER_SOCKET: ${{ steps.docker.outputs.sock }}
        run: |
          sudo systemctl stop docker.service docker.socket
          socket_path="${TEST_DOCKER_SOCKET#unix://}"
          test -S "$socket_path"
          sudo ln -sfn "$socket_path" /var/run/docker.sock
          docker --host unix:///var/run/docker.sock version
          test "$(curl --fail --silent --show-error --unix-socket /var/run/docker.sock http://localhost/v1.51/_ping)" = "OK"

      - name: Run tests with Gradle
        run: ./gradlew :lib:allTests --warning-mode=fail --max-workers=2 -PlibVersion=$LIB_VERSION

      - name: Verify isolated daemon restart and resubscription
        timeout-minutes: 8
        run: scripts/with-isolated-docker.sh ./gradlew :lib:daemonRestartTest --warning-mode=fail --console=plain --max-workers=2 -PlibVersion=$LIB_VERSION

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results-test
          path: |
            lib/build/test-results/**/*.xml

  publish-maven-central:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release version from tag
        run: echo "LIB_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/cache@v5
        with:
          path: |
            ./.gradle/
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Import GPG Key
        run: |
          echo '${{ secrets.GPG_SIGNING_KEY }}' | base64 -d > publish_key.gpg
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.SECRET_PASSPHRASE }}" \
            --output $GITHUB_WORKSPACE/release.gpg publish_key.gpg

      - name: Publish to Maven Central
        run: |
          ./gradlew :lib:publishAndReleaseToMavenCentral \
            -PlibVersion=$LIB_VERSION \
            -Psigning.secretKeyRingFile=$GITHUB_WORKSPACE/release.gpg \
            -Psigning.password=${{ secrets.GPG_PASSWORD }} \
            -Psigning.keyId=${{ secrets.GPG_KEY_ID }} \
            -PmavenCentralUsername=${{ secrets.OSSRH_USERNAME }} \
            -PmavenCentralPassword=${{ secrets.OSSRH_PASSWORD }}
        env:
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

  publish-test-results:
    name: Publish Unit Tests Results
    needs: [build, test]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      checks: write
      contents: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: unit-test-results-*
          path: artifacts

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.20.0
        with:
          files: artifacts/**/*.xml
