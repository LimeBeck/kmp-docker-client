      <path d="M36 156 L18 138 L18 174 Z" fill="#C711E1" />
      <path d="M96 172 L180 172" stroke="#FFFFFF" stroke-width="2" opacity="0.3" />
      <path d="M112 184 L168 184" stroke="#FFFFFF" stroke-width="2" opacity="0.3" />

