      <path d="M58 118 L90 118 L112 96 L80 96 Z" fill="url(#hBox1)" />
      <line x1="74" y1="118" x2="96" y2="96" stroke="#FFFFFF" stroke-width="1.5" opacity="0.35" />
      <line x1="82" y1="118" x2="104" y2="96" stroke="#FFFFFF" stroke-width="1.5" opacity="0.35" />

